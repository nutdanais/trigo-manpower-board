<title>Overview Card Layout</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: three mock Overview "In detail" grids side by side (stacked on phones): today, two columns (applied), and full-width rows. Light only, like the app. */
:root {
  color-scheme: light;
  --page: #eef1f4; --panel: #ffffff; --line: #e3e8ee; --text: #1f2937; --muted: #667085;
  --navy: #003a66; --gap: #f6d9d6; --gap-line: #e8a59d; --ok: #4d6810;
  --font: "Geist", "Segoe UI", Arial, sans-serif;
}
* { box-sizing: border-box; }
body { background: var(--page); color: var(--text); font: 14px/1.45 var(--font); }
.page { max-width: 1320px; margin: 0 auto; padding: 32px 16px 64px; }
h1 { font-size: 26px; font-weight: 650; letter-spacing: -.4px; margin: 0 0 8px; text-wrap: balance; }
.lead { color: var(--muted); max-width: 74ch; margin: 0 0 26px; text-wrap: pretty; }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; align-items: start; }
h2 { display: flex; align-items: center; gap: 9px; font-size: 16px; font-weight: 650; margin: 0 0 4px; }
.tag { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 5px; background: #f2f4f7; color: var(--muted); }
.tag.on { background: #eef5dd; color: var(--ok); }
.opt > p { margin: 0 0 10px; color: var(--muted); font-size: 13px; min-height: 3.8em; }
.mock { padding: 12px; border-radius: 10px; background: var(--page); box-shadow: 0 0 0 1px rgba(0,38,70,.08); }
.card { background: var(--panel); border-radius: 8px; box-shadow: 0 0 0 1px var(--line); padding: 10px 11px; }
.card b { display: block; font-size: 12px; }
.card i { display: block; height: 6px; margin-top: 7px; border-radius: 3px; background: #e6ebf1; }
.card i:nth-child(odd) { width: 78%; }
.hole { border-radius: 8px; background: repeating-linear-gradient(45deg, var(--gap) 0 6px, transparent 6px 12px); box-shadow: inset 0 0 0 1px var(--gap-line); display: grid; place-items: center; color: #a3271f; font-size: 11px; font-weight: 700; }
/* today: a 2-column grid, each row as tall as its taller card */
.today { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: start; }
/* two columns that fill independently */
.cols { columns: 2; column-gap: 10px; }
.cols .card { break-inside: avoid; margin-bottom: 10px; }
/* full-width rows */
.rows { display: grid; gap: 10px; }
.pc { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); }
.pc li::before { content: "+ "; color: var(--ok); font-weight: 700; }
.pc li.con::before { content: "− "; color: #a3271f; }
@media (max-width: 980px) { .grid { grid-template-columns: 1fr; } .opt > p { min-height: 0; } }
</style>

<div class="page">
  <h1>Closing the gaps on Overview</h1>
  <p class="lead">The "In detail" cards sat in a two-column grid, so every row was as tall as its taller card. A long By engineer list left a block of empty page next to Shifts, and Host coverage left one next to By service area. The hatched areas show where the page was blank.</p>
  <div class="grid" id="grid"></div>
</div>

<script>
const card = (name, lines) => `<div class="card"><b>${name}</b>${"<i></i>".repeat(lines)}</div>`;
const eng = card("By engineer", 14), shifts = card("Shifts", 3), area = card("By service area", 5), host = card("Host coverage", 12);
const hole = (h) => `<div class="hole" style="height:${h}px">blank</div>`;
const OPTS = [
  { name: "Today", tag: "the problem", why: "A grid with rows: the short card in each row leaves a hole beside the tall one.",
    html: `<div class="mock"><div class="today">${eng}<div style="display:grid;gap:10px">${shifts}${hole(120)}</div>${area}<div>${host}</div></div><div class="today" style="margin-top:-10px"><div>${hole(70)}</div></div></div>`,
    pros: [], cons: ["Big blank areas whenever one card has many rows"] },
  { name: "Two columns that fill on their own", tag: "applied", on: true, why: "Each column stacks its cards with no rows, so a short card is followed straight away by the next one.",
    html: `<div class="mock"><div class="cols">${eng}${area}${shifts}${host}</div></div>`,
    pros: ["No blank areas, whatever the lists hold", "Same two-column width as before", "Phones are unchanged (one column)"],
    cons: ["Cards read down the left column, then the right"] },
  { name: "Full-width rows", tag: "alternative", why: "Every card takes the whole width, one under another.",
    html: `<div class="mock"><div class="rows">${eng}${shifts}${area}${host}</div></div>`,
    pros: ["Simplest to read top to bottom", "Wide tables (By engineer) get more room"],
    cons: ["The page gets much longer", "Short cards like Shifts stretch across the screen"] },
];
document.getElementById("grid").innerHTML = OPTS.map((o) => `
  <section class="opt">
    <h2>${o.name}<span class="tag${o.on ? " on" : ""}">${o.tag}</span></h2>
    <p>${o.why}</p>
    ${o.html}
    <ul class="pc">${o.pros.map((x) => `<li>${x}</li>`).join("")}${o.cons.map((x) => `<li class="con">${x}</li>`).join("")}</ul>
  </section>`).join("");
</script>
